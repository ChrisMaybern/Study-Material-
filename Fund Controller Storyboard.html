<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Day in the Life — Fund Controller Status Quo</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #0D1B0F; --green: #0D2B1E; --teal: #3DAA7A; --cream: #FDF8F3;
  --amber: #C8860A; --red: #C0392B; --gray: #8A9B8E;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--cream); color:var(--ink); font-family:'IBM Plex Sans',sans-serif; font-size:15px; line-height:1.6; }

#gate {
  position:fixed; inset:0; z-index:9999; background:var(--green);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  transition:opacity 0.6s ease, transform 0.6s ease;
}
#gate.unlocked { opacity:0; transform:scale(1.05); pointer-events:none; }
#gate::before {
  content:''; position:absolute; inset:0;
  background: repeating-linear-gradient(0deg, transparent, transparent 39px, rgba(61,170,122,0.06) 39px, rgba(61,170,122,0.06) 40px);
  pointer-events:none;
}
.gate-logo {
  font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:5px;
  text-transform:uppercase; color:var(--teal); margin-bottom:48px; position:relative;
}
.gate-icon { width:64px; height:64px; margin-bottom:32px; position:relative; opacity:0.7; }
.gate-icon svg { width:100%; height:100%; }
.gate-title {
  font-family:'Playfair Display',Georgia,serif; font-size:28px; font-weight:400;
  color:#fff; margin-bottom:8px; position:relative;
}
.gate-sub { font-size:13px; font-weight:300; color:rgba(255,255,255,0.4); margin-bottom:36px; position:relative; }
.gate-form { display:flex; flex-direction:column; align-items:center; gap:16px; position:relative; }
.gate-input-wrap { position:relative; width:320px; }
.gate-input {
  width:100%; padding:14px 48px 14px 20px; background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.15); border-radius:6px; color:#fff;
  font-family:'IBM Plex Sans',sans-serif; font-size:14px; font-weight:400; letter-spacing:1px;
  outline:none; transition:border-color 0.3s, box-shadow 0.3s;
}
.gate-input::placeholder { color:rgba(255,255,255,0.25); letter-spacing:0; }
.gate-input:focus { border-color:rgba(61,170,122,0.5); box-shadow:0 0 20px rgba(61,170,122,0.1); }
.gate-input.error { border-color:var(--red); animation:shake 0.4s ease; }
@keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-8px)} 50%{transform:translateX(8px)} 75%{transform:translateX(-4px)} }
.gate-eye {
  position:absolute; right:14px; top:50%; transform:translateY(-50%);
  background:none; border:none; cursor:pointer; color:rgba(255,255,255,0.3);
  transition:color 0.2s; padding:4px;
}
.gate-eye:hover { color:rgba(255,255,255,0.6); }
.gate-btn {
  width:320px; padding:14px; background:var(--teal); color:var(--green); border:none; border-radius:6px;
  font-family:'IBM Plex Sans',sans-serif; font-size:13px; font-weight:600; letter-spacing:1px;
  text-transform:uppercase; cursor:pointer; transition:all 0.3s;
}
.gate-btn:hover { transform:translateY(-2px); box-shadow:0 8px 30px rgba(61,170,122,0.3); }
.gate-error { font-size:12px; color:#ff6b6b; font-weight:400; height:18px; opacity:0; transition:opacity 0.3s; }
.gate-error.show { opacity:1; }
.gate-footer {
  position:absolute; bottom:32px; font-family:'IBM Plex Mono',monospace;
  font-size:9px; letter-spacing:3px; text-transform:uppercase; color:rgba(255,255,255,0.15);
}
.gate-spinner { display:none; width:20px; height:20px; border:2px solid rgba(13,43,30,0.3); border-top-color:var(--green); border-radius:50%; animation:spin 0.6s linear infinite; }
.gate-spinner.show { display:inline-block; }
@keyframes spin { to{transform:rotate(360deg)} }
@media(max-width:768px) { .gate-input-wrap, .gate-btn { width:280px; } }
</style>
</head>
<body>

<div id="gate">
  <div class="gate-logo">Maybern · Sales Training</div>
  <div class="gate-icon"><svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="8" y="28" width="48" height="32" rx="6" stroke="#3DAA7A" stroke-width="2" fill="rgba(61,170,122,0.06)"/><path d="M20 28V20a12 12 0 0 1 24 0v8" stroke="#3DAA7A" stroke-width="2" stroke-linecap="round" fill="none"/><circle cx="32" cy="44" r="4" fill="#3DAA7A" opacity="0.6"/><line x1="32" y1="48" x2="32" y2="53" stroke="#3DAA7A" stroke-width="2" stroke-linecap="round"/></svg></div>
  <div class="gate-title">Protected Content</div>
  <div class="gate-sub">Enter the access code to continue</div>
  <div class="gate-form">
    <div class="gate-input-wrap">
      <input type="password" id="gateInput" class="gate-input" placeholder="Access code" autocomplete="off" autofocus/>
      <button class="gate-eye" id="gateEye" type="button"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
    </div>
    <button class="gate-btn" id="gateBtn"><span id="btnText">Unlock</span> <span class="gate-spinner" id="btnSpin"></span></button>
    <div class="gate-error" id="gateError">Incorrect access code</div>
  </div>
  <div class="gate-footer">Confidential — Maybern 2026</div>
</div>

function b64decode(s) {
  const bin = atob(s);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return bytes;
}

async function deriveKey(password, salt) {
  const enc = new TextEncoder();
  const keyMaterial = await crypto.subtle.importKey("raw", enc.encode(password), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: salt, iterations: 100000, hash: "SHA-256" },
    keyMaterial,
    { name: "AES-GCM", length: 256 },
    false,
    ["decrypt"]
  );
}

async function decrypt(password) {
  const salt = b64decode(ENC.salt);
  const iv = b64decode(ENC.iv);
  const ct = b64decode(ENC.ct);
  const key = await deriveKey(password, salt);
  const decrypted = await crypto.subtle.decrypt({ name: "AES-GCM", iv: iv }, key, ct);
  return new TextDecoder().decode(decrypted);
}

async function unlock() {
  const input = document.getElementById('gateInput');
  const pw = input.value.trim().toLowerCase();
  const btnText = document.getElementById('btnText');
  const btnSpin = document.getElementById('btnSpin');
  const errEl = document.getElementById('gateError');

  btnText.textContent = 'Decrypting...';
  btnSpin.classList.add('show');

  try {
    const html = await decrypt(pw);
    const container = document.getElementById('protected-content');
    container.innerHTML = html;

    // Execute any scripts in the decrypted payload
    container.querySelectorAll('script').forEach(oldScript => {
      const newScript = document.createElement('script');
      newScript.textContent = oldScript.textContent;
      oldScript.parentNode.replaceChild(newScript, oldScript);
    });

    document.getElementById('gate').classList.add('unlocked');
    setTimeout(() => { document.getElementById('gate').style.display = 'none'; }, 700);
  } catch (e) {
    input.classList.add('error');
    errEl.classList.add('show');
    setTimeout(() => input.classList.remove('error'), 500);
    setTimeout(() => errEl.classList.remove('show'), 2500);
    btnText.textContent = 'Unlock';
    btnSpin.classList.remove('show');
  }
}

document.getElementById('gateBtn').addEventListener('click', unlock);
document.getElementById('gateInput').addEventListener('keydown', e => { if (e.key === 'Enter') unlock(); });

let eyeOpen = false;
document.getElementById('gateEye').addEventListener('click', () => {
  eyeOpen = !eyeOpen;
  document.getElementById('gateInput').type = eyeOpen ? 'text' : 'password';
});
