<title>Fund Accounting and Scenario Modeling Complexity Explained Sales Friendly — Maybern</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --deep: #091D13; --dark: #092115; --green: #17412D;
  --mint: #ECFFF5; --light-mint: #F6FFFA; --accent: #22C55E;
  --amber: #F59E0B; --red: #EF4444; --glow: rgba(34,197,94,0.4); --blue: #3B82F6;
}
* { margin:0; padding:0; box-sizing:border-box; }
html, body { height:100%; overflow:hidden; background:var(--deep); color:var(--mint); font-family:'Inter',sans-serif; }

#gate {
  position:fixed; inset:0; z-index:9999; background:var(--deep);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  transition:opacity 0.6s ease, transform 0.6s ease;
}
#gate.unlocked { opacity:0; transform:scale(1.05); pointer-events:none; }
#gate::before {
  content:''; position:absolute; inset:0;
  background: radial-gradient(ellipse 70% 50% at 30% 70%, rgba(34,197,94,0.04) 0%, transparent 70%),
    radial-gradient(ellipse 50% 40% at 70% 30%, rgba(236,255,245,0.02) 0%, transparent 60%);
  pointer-events:none;
}
.gate-logo { font-size:11px; letter-spacing:7px; text-transform:uppercase; font-weight:600; color:var(--accent); margin-bottom:48px; position:relative; }
.gate-icon { width:64px; height:64px; margin-bottom:32px; position:relative; opacity:0.6; }
.gate-icon svg { width:100%; height:100%; }
.gate-title { font-family:'Playfair Display',Georgia,serif; font-size:28px; font-weight:400; color:var(--mint); margin-bottom:8px; position:relative; }
.gate-sub { font-size:13px; font-weight:300; color:rgba(236,255,245,0.4); margin-bottom:36px; position:relative; }
.gate-form { display:flex; flex-direction:column; align-items:center; gap:16px; position:relative; }
.gate-input-wrap { position:relative; width:320px; }
.gate-input {
  width:100%; padding:14px 48px 14px 20px; background:rgba(236,255,245,0.04);
  border:1px solid rgba(236,255,245,0.1); border-radius:10px; color:var(--mint);
  font-family:'Inter',sans-serif; font-size:14px; font-weight:400; letter-spacing:1px;
  outline:none; transition:border-color 0.3s, box-shadow 0.3s;
}
.gate-input::placeholder { color:rgba(236,255,245,0.2); letter-spacing:0; }
.gate-input:focus { border-color:rgba(34,197,94,0.4); box-shadow:0 0 20px rgba(34,197,94,0.08); }
.gate-input.error { border-color:var(--red); animation:shake 0.4s ease; }
@keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-8px)} 50%{transform:translateX(8px)} 75%{transform:translateX(-4px)} }
.gate-eye { position:absolute; right:14px; top:50%; transform:translateY(-50%); background:none; border:none; cursor:pointer; color:rgba(236,255,245,0.3); transition:color 0.2s; padding:4px; }
.gate-eye:hover { color:rgba(236,255,245,0.6); }
.gate-btn {
  width:320px; padding:14px; background:var(--accent); color:var(--deep); border:none; border-radius:10px;
  font-family:'Inter',sans-serif; font-size:13px; font-weight:600; letter-spacing:1px; text-transform:uppercase;
  cursor:pointer; transition:all 0.3s;
}
.gate-btn:hover { transform:translateY(-2px); box-shadow:0 8px 30px rgba(34,197,94,0.3); }
.gate-error { font-size:12px; color:var(--red); font-weight:400; height:18px; opacity:0; transition:opacity 0.3s; }
.gate-error.show { opacity:1; }
.gate-footer { position:absolute; bottom:32px; font-size:10px; letter-spacing:2px; text-transform:uppercase; color:rgba(236,255,245,0.15); }
.gate-spinner { display:none; width:20px; height:20px; border:2px solid rgba(9,29,19,0.3); border-top-color:var(--deep); border-radius:50%; animation:spin 0.6s linear infinite; }
.gate-spinner.show { display:inline-block; }
@keyframes spin { to{transform:rotate(360deg)} }
@media(max-width:1000px) { .gate-input-wrap, .gate-btn { width:280px; } }
</style>
</head>

function b64decode(s) {
  const bin = atob(s);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return bytes;
}

async function deriveKey(password, salt) {
  const enc = new TextEncoder();
  const keyMaterial = await crypto.subtle.importKey("raw", enc.encode(password), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: salt, iterations: 100000, hash: "SHA-256" },
    keyMaterial,
    { name: "AES-GCM", length: 256 },
    false,
    ["decrypt"]
  );
}

async function decrypt(password) {
  const salt = b64decode(ENC.salt);
  const iv = b64decode(ENC.iv);
  const ct = b64decode(ENC.ct);
  const key = await deriveKey(password, salt);
  const decrypted = await crypto.subtle.decrypt({ name: "AES-GCM", iv: iv }, key, ct);
  return new TextDecoder().decode(decrypted);
}

async function unlock() {
  const input = document.getElementById('gateInput');
  const pw = input.value.trim().toLowerCase();
  const btnText = document.getElementById('btnText');
  const btnSpin = document.getElementById('btnSpin');
  const errEl = document.getElementById('gateError');

  btnText.textContent = 'Decrypting...';
  btnSpin.classList.add('show');

  try {
    const html = await decrypt(pw);

    // Success — inject decrypted content
    const container = document.getElementById('protected-content');
    container.innerHTML = html;

    // Execute any scripts in the decrypted payload
    container.querySelectorAll('script').forEach(oldScript => {
      const newScript = document.createElement('script');
      newScript.textContent = oldScript.textContent;
      oldScript.parentNode.replaceChild(newScript, oldScript);
    });

    // Animate gate away
    document.getElementById('gate').classList.add('unlocked');
    setTimeout(() => { document.getElementById('gate').style.display = 'none'; }, 700);

  } catch (e) {
    // Wrong password — AES-GCM will throw on bad key
    input.classList.add('error');
    errEl.classList.add('show');
    setTimeout(() => input.classList.remove('error'), 500);
    setTimeout(() => errEl.classList.remove('show'), 2500);
    btnText.textContent = 'Unlock';
    btnSpin.classList.remove('show');
  }
}

document.getElementById('gateBtn').addEventListener('click', unlock);
document.getElementById('gateInput').addEventListener('keydown', e => { if (e.key === 'Enter') unlock(); });

let eyeOpen = false;
document.getElementById('gateEye').addEventListener('click', () => {
  eyeOpen = !eyeOpen;
  document.getElementById('gateInput').type = eyeOpen ? 'text' : 'password';
});
</script>
